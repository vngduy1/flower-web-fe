name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  NEXT_PUBLIC_API_BASE_URL: /api
  BACKEND_API_BASE_URL: http://127.0.0.1:3000/api
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out frontend
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check whitespace and generated diffs
        run: |
          git diff --check
          git diff --exit-code

  e2e-configuration:
    name: Check E2E secret configuration
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.configuration.outputs.enabled }}

    steps:
      - id: configuration
        name: Detect configured secrets
        env:
          CI_DB_ROOT_PASSWORD: ${{ secrets.CI_DB_ROOT_PASSWORD }}
          CI_JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: |
          if [[ -n "$CI_DB_ROOT_PASSWORD" && -n "$CI_JWT_SECRET" && -n "$E2E_ADMIN_EMAIL" && -n "$E2E_ADMIN_PASSWORD" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Real-service E2E is enabled." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Real-service E2E is skipped because one or more required repository secrets are unavailable." >> "$GITHUB_STEP_SUMMARY"
          fi

  real-service-e2e:
    name: Real-service Playwright E2E
    needs: [frontend-quality, e2e-configuration]
    if: needs.e2e-configuration.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_DB_ROOT_PASSWORD }}
          MYSQL_DATABASE: flower_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      NODE_ENV: test
      DEPLOYMENT_ENV: test
      APP_HOST: 127.0.0.1
      APP_PORT: "3000"
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USERNAME: root
      DB_PASSWORD: ${{ secrets.CI_DB_ROOT_PASSWORD }}
      DB_DATABASE: flower_e2e
      DB_SYNCHRONIZE: "false"
      DB_DROP_SCHEMA: "false"
      DB_LOGGING: "false"
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      JWT_EXPIRES_IN: 1h
      MAIL_ENABLED: "false"
      E2E_BASE_URL: http://127.0.0.1:3001
      E2E_API_BASE_URL: http://127.0.0.1:3000/api
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

    steps:
      - name: Check out frontend
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: Check out backend
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BACKEND_REPOSITORY || 'vngduy1/flower-web-be' }}
          ref: ${{ vars.BACKEND_REF || 'main' }}
          path: backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Verify backend operational surface
        working-directory: backend
        run: |
          npm run format:check
          npx eslint "src/common/**/*.ts" src/app.module.ts src/main.ts test/seed-e2e.ts --max-warnings=0
          npm run typecheck
          npm test -- --runInBand
          npm run build

      - name: Reset and seed isolated E2E database
        working-directory: backend
        env:
          DB_SYNCHRONIZE: "true"
          DB_DROP_SCHEMA: "true"
          E2E_ALLOW_RESET: "true"
        run: npm run seed:e2e

      - name: Start backend
        working-directory: backend
        run: |
          npm run start:prod > ../backend.log 2>&1 &
          echo "$!" > ../backend.pid

      - name: Wait for backend readiness
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready" >&2
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start frontend production server
        working-directory: frontend
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3001 > ../frontend.log 2>&1 &
          echo "$!" > ../frontend.pid

      - name: Wait for frontend readiness
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3001/health/ready > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Frontend did not become ready" >&2
          exit 1

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-service-e2e-failure-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            backend.log
            frontend.log
            frontend/playwright-report
            frontend/test-results

      - name: Stop application services
        if: always()
        run: |
          for pid_file in frontend.pid backend.pid; do
            if [[ -f "$pid_file" ]]; then
              kill "$(cat "$pid_file")" 2>/dev/null || true
            fi
          done
